[tool.uv.workspace]
members = ["packages/*"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.16.8",
    "pytest-cov>=7.1.0",
    "diff-cover>=10.5.1",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocstrings[python]>=0.28.0",
]

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if t.TYPE_CHECKING:",
    "if typing.TYPE_CHECKING:",
    "if TYPE_CHECKING:",
]

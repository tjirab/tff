layers:
  order: [sources, core, marts]

# Custom exclusions and allowed exceptions configured directly in YAML
# (consolidated from previously separate linter_exclusions.json)
exclusions:
  - source_layer: marts
    source_domain: finance
    target_layer: marts
    target_domain: marketing

allowed_exceptions:
  - model: sqlmesh_example.marketing_all_users
    dependency: sqlmesh_example.finance_stats

# Schema contracts configured directly in YAML
# (consolidated from previously separate linter_contract_groups.json)
contract_groups:
  dimension_parity_groups:
    - left:
        file: models/marts/finance/finance_stats.sql
        exclude_columns: [revenue]
      right:
        file: models/sources/src_users.sql
        exclude_columns: [user_name, created_date]

checks:
  layer_integrity: { enabled: true }
  custom_exclusions: { enabled: true }
  schema_contracts: { enabled: true }
  dependency_graph:
    enabled: true
    fan_out_warn: 5
    fan_out_fail: 10
    fan_in_warn: 5
  duplicate_ctes: { enabled: true }

rules:
  ban_select_star:
    enabled: true
    skip_layers: [sources]
  environment_agnostic_references:
    enabled: true
    banned_environments: [prod, dev, staging, uat, qa]
  mart_naming:
    enabled: true
    layer_name: marts
    rule: prefix_with_subdirectory
  sql_complexity:
    enabled: true
    thresholds:
      decision_points: [5, 10]
      cte_count: [3, 5]
      join_count: [3, 5]
      line_count: [30, 50]
  metadata:
    owner: true
    description: true
    grain: true
    unique_values: true
  filename_equals_modelname:
    enabled: true

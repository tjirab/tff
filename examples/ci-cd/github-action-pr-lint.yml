name: TFF PR Health & Architectural Linting

on:
  pull_request:
    branches: [ main, develop ]

jobs:
  tff-check:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: write  # Required for posting/updating PR summary comment
    steps:
      - name: Checkout Repository Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0  # Required for calculating health score diff vs base branch

      - name: Run TFF Fitness Functions
        uses: tjirab/tff@v1
        with:
          project: "examples/minimal-sqlmesh-project"
          provider: "auto"
          fail-under: "80.0"
          fail-level: "error"
          comment-pr: "true"


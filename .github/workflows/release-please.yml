name: Release Please

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      release_created: ${{ steps.release.outputs['packages/tff-core--release_created'] }}
      tag_name: ${{ steps.release.outputs['packages/tff-core--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish:
    runs-on: ubuntu-latest
    needs: release-please
    if: ${{ needs.release-please.outputs.release_created == 'true' || github.event_name == 'workflow_dispatch' }}
    permissions:
      id-token: write  # Mandatory for Trusted Publishing
      contents: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release-please.outputs.tag_name || github.ref }}
      - name: Set up uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true
      - name: Build all packages
        run: |
          uv build --package tff-core
      - name: Publish all packages to PyPI
        uses: pypa/gh-action-pypi-publish@release/v1
        with:
          packages-dir: dist/

  sync-action-tag:
    runs-on: ubuntu-latest
    needs:
      - release-please
      - publish
    if: ${{ needs.release-please.outputs.release_created == 'true' }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - name: Update floating major tag for GitHub Action
        env:
          TAG_NAME: ${{ needs.release-please.outputs.tag_name }}
        run: |
          if [ -z "${TAG_NAME}" ]; then
            echo "Missing tag_name output from release-please" >&2
            exit 1
          fi
          MAJOR_TAG="${TAG_NAME%%.*}"
          if [[ ! "${MAJOR_TAG}" =~ ^v[0-9]+$ ]]; then
            echo "Unexpected tag format: ${TAG_NAME}" >&2
            exit 1
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -f "${MAJOR_TAG}" "${TAG_NAME}^{commit}"
          git push origin "refs/tags/${MAJOR_TAG}" --force

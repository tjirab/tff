[project]
name = "tff-core"
version = "0.9.0"
description = "Core rules and fitness functions engine for transformation projects"
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [
    { name = "Bart Schuijt", email = "schuijt.bart@gmail.com" }
]
dependencies = [
    "pydantic>=2.13.5",
    "pyyaml>=6.0",
    "rich>=13.0",
    "sqlglot>=23.0",
]
classifiers = [
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
]

[project.optional-dependencies]
sqlmesh = [
    "sqlmesh>=0.236.1",
]
dbt = []

[project.scripts]
tff = "tff.core.cli:main"
tff-dbt = "tff.dbt.cli:main"
tff-sqlmesh = "tff.sqlmesh.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/tff"]

